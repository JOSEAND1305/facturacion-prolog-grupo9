<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facturación · Grupo 9</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <div class="contenedor">
      <p class="marca">Grupo 9</p>
      <h1>Facturación</h1>
      <nav aria-label="Secciones">
        <a href="#nueva">Nueva factura</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#historial">Historial</a>
        <a href="#reportes">Reportes</a>
      </nav>
    </div>
  </header>
  <main class="contenedor">
    <section id="nueva">
      <h2>Nueva factura</h2>
      <form id="formulario">
        <label>Cliente <select id="cliente" required></select></label>
        <label for="forma_pago">Forma de pago</label>
        <select id="forma_pago" name="forma_pago" required>
          <option value="contado">Contado</option>
          <option value="credito">Crédito</option>
        </select>
        <div id="lineas"></div>
        <p>
          <strong>Subtotal estimado:</strong>
          <output id="subtotal-estimado" aria-live="polite">₡0,00</output>
        </p>
        <div class="acciones">
          <button type="button" id="agregar" class="secundario">Agregar línea</button>
          <button type="submit" id="guardar" disabled>Guardar borrador</button>
        </div>
      </form>
      <p id="estado-formulario" role="status"></p>
    </section>
    <section id="catalogo">
      <h2>Catálogo</h2>
      <div class="tabla">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Producto</th>
              <th>Tipo</th>
              <th>Categoría</th>
              <th>Precio base</th>
              <th>Stock</th>
            </tr>
        </thead>
          <tbody id="productos"></tbody>
        </table>
      </div>
    </section>
    <section id="historial">
      <h2>Historial</h2>
      <div class="acciones">
  <label>
    Cliente
    <select id="historial-cliente">
      <option value="">Todos los clientes</option>
    </select>
  </label>

  <label>
    Estado
    <select id="historial-estado">
      <option value="">Todos los estados</option>
      <option value="borrador">Borrador</option>
      <option value="emitida">Emitida</option>
      <option value="rechazada">Rechazada</option>
    </select>
  </label>
</div>
      <p id="estado-historial" role="status"></p>
      <div class="tabla">
        <table>
          <thead><tr><th>Factura</th><th>Cliente</th><th>Estado</th><th>Total</th></tr></thead>
          <tbody id="facturas"></tbody>
        </table>
      </div>
      <article id="detalle" hidden>
        <h3 id="titulo-detalle" tabindex="-1"></h3>
        <p id="estado-emision" role="status"></p>
        <div id="contenido-detalle"></div>
        <button id="emitir" hidden>Emitir factura</button>
      </article>
    </section>
    <section id="reportes">
      <h2>Reportes</h2>
      <form id="filtros">
        <label>Desde <input type="date" name="desde"></label>
        <label>Hasta <input type="date" name="hasta"></label>
        <button>Consultar</button>
      </form>
      <p id="estado-reportes" role="status"></p>
      <div id="resultados"></div>
    </section>
  </main>
</body>
</html>
