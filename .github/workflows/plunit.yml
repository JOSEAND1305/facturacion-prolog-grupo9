name: Pruebas de Prolog

on:
  pull_request:

permissions:
  contents: read

jobs:
  plunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Ejecutar plunit
        run: swipl -q -s reglas/facturacion_tests.pl -g run_tests -t halt
